<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sevenbaby.py 演唱會現場預購表單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-bg': '#80C5D6',         // 天空藍背景
                        'custom-pink': '#FBA4AE',       // 主要強調粉色
                        'custom-light-pink': '#FDE4D8', // 淺粉色區塊背景
                        'custom-blue-green': '#B6DFD6', // 藍綠色點綴
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        .focus-custom-pink:focus {
            border-color: #FBA4AE;
            box-shadow: 0 0 0 3px rgba(251, 164, 174, 0.4);
        }
        /* 隱藏捲軸但可滾動 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(251, 164, 174, 0.5); border-radius: 10px; }
    </style>
</head>
<body class="bg-custom-bg min-h-screen p-4 md:p-8 flex justify-center items-start text-gray-800">

    <div class="bg-custom-light-pink w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border-4 border-white">
        <!-- 標題區塊 -->
        <div class="bg-custom-pink text-white text-center py-6 px-4 shadow-sm">
            <h1 class="text-3xl font-extrabold tracking-wide drop-shadow-md leading-tight">
                sevenbaby.py<br>
                <span class="text-2xl mt-1 block">演唱會現場預購表單</span>
            </h1>
        </div>

        <div class="p-6 md:p-8">
            <form id="preorderForm" class="space-y-6">
                
                <!-- 動態產生的品項會放在這裡 -->
                <div id="itemsContainer" class="space-y-6"></div>

                <!-- 新增品項按鈕 -->
                <button type="button" id="addItemBtn" class="w-full bg-white border-2 border-custom-pink text-custom-pink font-bold py-3 rounded-xl hover:bg-custom-pink hover:text-white transition-colors shadow-sm flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    新增其他品項
                </button>

                <hr class="border-t-2 border-white my-6">

                <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">姓名</label>
                    <input type="text" id="nameField" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium">
                </div>

                <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">電話</label>
                    <input type="tel" id="phoneField" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium">
                </div>
                
                <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">LINE名稱</label>
                    <input type="text" id="lineNameField" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium">
                </div>

                <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">寄送方式</label>
                    <select id="shippingMethod" name="shipping" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800">
                        <option value="none">請選擇寄送方式</option>
                        <option value="registered">掛號 (+30)</option>
                        <option value="store">7-11店到店 (+60)</option>
                    </select>
                </div>

                <div id="sevenElevenBlock" class="hidden space-y-4 bg-white/50 p-4 rounded-xl border border-white">
                    <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                        <div></div>
                        <div>
                            <a href="https://emap.pcsc.com.tw" target="_blank" class="text-blue-500 hover:text-blue-700 font-bold underline text-sm inline-flex items-center gap-1 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                                店號查詢 https://emap.pcsc.com.tw
                            </a>
                        </div>
                    </div>
                    <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                        <label class="text-right font-bold text-gray-700 leading-tight">7-11店名<br>+店號</label>
                        <input type="text" id="storeField" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" placeholder="例如：立言門市 123456">
                    </div>
                </div>

                <div id="normalAddressBlock" class="hidden space-y-4 bg-white/50 p-4 rounded-xl border border-white">
                    <div class="grid grid-cols-[90px_1fr_auto] gap-2 items-center">
                        <label class="text-right font-bold text-gray-700">地址</label>
                        <input type="text" id="addressField" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800">
                        <button type="button" id="fetchZipBtn" class="bg-custom-pink text-white px-2 py-2 rounded-lg font-bold hover:bg-opacity-80 transition-colors text-xs shadow-sm leading-tight text-center">
                            自動抓取<br>郵遞區號
                        </button>
                    </div>
                    <!-- 顯示完整地址 -->
                    <div class="grid grid-cols-[90px_1fr] gap-2 items-center hidden" id="fullAddressRow">
                        <label class="text-right font-bold text-gray-700">完整地址</label>
                        <input type="text" id="fullAddressField" class="w-full p-3 border-2 border-transparent bg-white/70 rounded-lg text-gray-600 font-medium" readonly>
                    </div>
                </div>

                <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">付款狀態</label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="isPaidCheckbox" class="w-5 h-5 text-custom-pink bg-white border-white rounded focus:ring-custom-pink focus:ring-2 accent-custom-pink cursor-pointer">
                        <span class="ml-2 font-bold text-gray-700">已付款</span>
                    </label>
                </div>

                <div class="bg-custom-blue-green text-gray-800 p-4 rounded-xl flex justify-between items-center shadow-inner border-2 border-white">
                    <span class="font-bold text-lg">結算金額</span>
                    <span class="font-black text-2xl">NT$ <span id="totalAmount">0</span></span>
                </div>

                <!-- 送出按鈕 -->
                <button type="button" id="submitBtn" class="w-full bg-custom-pink text-white font-extrabold text-xl py-4 rounded-xl hover:bg-opacity-90 transition-all shadow-lg transform active:scale-95">
                    確認送出
                </button>
            </form>
        </div>
    </div>

    <div id="messageOverlay" class="fixed inset-0 bg-black bg-opacity-40 hidden flex justify-center items-center z-50 transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center transform scale-95 transition-transform" id="messageBox">
            <h2 id="messageTitle" class="text-xl font-bold mb-4 text-gray-800">提示</h2>
            <p id="messageText" class="text-gray-600 mb-6 font-medium">訊息內容</p>
            <button id="messageCloseBtn" class="bg-custom-pink text-white px-6 py-2 rounded-lg font-bold hover:bg-opacity-90 transition-colors w-full">確認</button>
        </div>
    </div>

    <script>
        // === 填入您的 Google Apps Script 網址 ===
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfZJtDH75exrwCQsHaA_mgyPUL108oFkbELp7-ACSokShecjzO1RwHy9U_epKIrd8rew/exec';

        // DOM 元素
        const itemsContainer = document.getElementById('itemsContainer');
        const addItemBtn = document.getElementById('addItemBtn');
        const totalAmountDisplay = document.getElementById('totalAmount');
        const shippingMethod = document.getElementById('shippingMethod');
        const submitBtn = document.getElementById('submitBtn');
        
        // 區塊切換 DOM
        const sevenElevenBlock = document.getElementById('sevenElevenBlock');
        const normalAddressBlock = document.getElementById('normalAddressBlock');
        
        // 地址相關 DOM
        const fetchZipBtn = document.getElementById('fetchZipBtn');
        const addressField = document.getElementById('addressField');
        const fullAddressRow = document.getElementById('fullAddressRow');
        const fullAddressField = document.getElementById('fullAddressField');
        
        let itemCount = 0;

        // 初始化產生第一個品項
        window.addEventListener('DOMContentLoaded', () => {
            createItemBlock();
        });

        // 動態建立品項區塊
        function createItemBlock() {
            itemCount++;
            const id = itemCount;
            
            const itemHtml = `
                <div class="bg-white/60 p-4 rounded-xl border-2 border-white shadow-sm relative" id="itemBlock_${id}">
                    ${id > 1 ? `<button type="button" onclick="removeItem(${id})" class="absolute -top-3 -right-3 bg-red-400 text-white w-8 h-8 rounded-full font-bold shadow-md hover:bg-red-500 flex items-center justify-center text-sm">&times;</button>` : ''}
                    <h3 class="font-bold text-gray-600 mb-3 border-b-2 border-white pb-2">品項 ${id}</h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                            <label class="text-right font-bold text-gray-700">品項</label>
                            <select id="itemType_${id}" class="w-full p-2 border-2 border-white bg-white rounded-lg focus:outline-none focus-custom-pink transition-colors item-type-select font-medium text-gray-800" onchange="calculateTotal()">
                                <option value="none" data-price="0">請選擇...</option>
                                <option value="keychain" data-price="250">雙掛件 ($250)</option>
                                <option value="stand" data-price="450">手機支架 ($450)</option>
                                <option value="acrylic" data-price="450">立牌 ($450)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                            <label class="text-right font-bold text-gray-700">樣式</label>
                            <input type="text" id="itemStyle_${id}" class="w-full p-2 border-2 border-white bg-white rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" placeholder="ex: 東海老虎款">
                        </div>
                        <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                            <label class="text-right font-bold text-gray-700">數量</label>
                            <input type="number" id="itemQty_${id}" min="1" value="1" class="w-full p-2 border-2 border-white bg-white rounded-lg focus:outline-none focus-custom-pink transition-colors item-qty-input font-medium text-gray-800" oninput="calculateTotal()">
                        </div>
                        <div class="grid grid-cols-[90px_1fr] gap-4 items-center">
                            <label class="text-right font-bold text-gray-700">圖片上傳</label>
                            <input type="file" id="itemImage_${id}" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-custom-pink file:text-white hover:file:bg-opacity-80 transition-colors bg-white border-2 border-white rounded-lg cursor-pointer">
                        </div>
                    </div>
                </div>
            `;
            
            itemsContainer.insertAdjacentHTML('beforeend', itemHtml);
            calculateTotal();
        }

        // 移除品項區塊
        function removeItem(id) {
            const block = document.getElementById(`itemBlock_${id}`);
            if (block) {
                block.remove();
                calculateTotal();
            }
        }

        // 新增按鈕綁定
        addItemBtn.addEventListener('click', createItemBlock);

        // 寄送方式切換顯示邏輯
        shippingMethod.addEventListener('change', () => {
            calculateTotal();
            
            if (shippingMethod.value === 'store') {
                // 顯示 7-11，隱藏 一般地址
                sevenElevenBlock.classList.remove('hidden');
                normalAddressBlock.classList.add('hidden');
            } else if (shippingMethod.value === 'registered') {
                // 顯示 一般地址，隱藏 7-11
                sevenElevenBlock.classList.add('hidden');
                normalAddressBlock.classList.remove('hidden');
            } else {
                // 都隱藏
                sevenElevenBlock.classList.add('hidden');
                normalAddressBlock.classList.add('hidden');
            }
        });

        // 自動抓取郵遞區號
        fetchZipBtn.addEventListener('click', async () => {
            const addr = addressField.value.trim();
            if (!addr) {
                showMessageBox('請先輸入地址！', true);
                return;
            }
            
            const originalBtnHtml = fetchZipBtn.innerHTML;
            fetchZipBtn.textContent = '抓取中...';
            fetchZipBtn.disabled = true;
            
            try {
                const response = await fetch(`https://zip5.5432.tw/zip5json.py?adrs=${encodeURIComponent(addr)}`);
                const data = await response.json();
                
                if (data.zipcode6) {
                    fullAddressField.value = `${data.zipcode6} ${addr}`;
                    fullAddressRow.classList.remove('hidden');
                } else if (data.zipcode) {
                    fullAddressField.value = `${data.zipcode} ${addr}`;
                    fullAddressRow.classList.remove('hidden');
                } else {
                    showMessageBox('找不到對應的郵遞區號，請確認地址是否正確。', true);
                }
            } catch (error) {
                console.error('API Error:', error);
                showMessageBox('抓取郵遞區號發生錯誤，請稍後再試。', true);
            } finally {
                fetchZipBtn.innerHTML = originalBtnHtml;
                fetchZipBtn.disabled = false;
            }
        });

        // 計算總金額
        function calculateTotal() {
            let total = 0;
            
            for (let i = 1; i <= itemCount; i++) {
                const typeSelect = document.getElementById(`itemType_${i}`);
                const qtyInput = document.getElementById(`itemQty_${i}`);
                
                if (typeSelect && qtyInput) {
                    const price = parseInt(typeSelect.options[typeSelect.selectedIndex].dataset.price || 0);
                    const qty = parseInt(qtyInput.value || 0);
                    total += price * qty;
                }
            }
            
            if (shippingMethod.value === 'registered') {
                total += 30;
            } else if (shippingMethod.value === 'store') {
                total += 60;
            }
            
            totalAmountDisplay.textContent = total;
        }

        // 輔助函式：檔案轉 Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // 提交表單資料
        submitBtn.addEventListener('click', async () => {
            // 基本驗證
            if (!document.getElementById('nameField').value.trim()) return showMessageBox('請填寫姓名！', true);
            if (!document.getElementById('phoneField').value.trim()) return showMessageBox('請填寫電話！', true);
            if (shippingMethod.value === 'none') return showMessageBox('請選擇寄送方式！', true);
            
            let finalAddress = '';
            if (shippingMethod.value === 'store') {
                finalAddress = document.getElementById('storeField').value.trim();
                if (!finalAddress) return showMessageBox('請填寫 7-11 店名與店號！', true);
            } else {
                finalAddress = fullAddressField.value.trim() || addressField.value.trim();
                if (!finalAddress) return showMessageBox('請填寫寄送地址！', true);
            }

            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = '資料傳送中...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const itemsData = [];
                for (let i = 1; i <= itemCount; i++) {
                    const typeSelect = document.getElementById(`itemType_${i}`);
                    if (!typeSelect) continue; // 如果區塊被刪除則跳過
                    
                    const typeVal = typeSelect.value;
                    if (typeVal === 'none') continue;

                    const style = document.getElementById(`itemStyle_${i}`).value.trim();
                    const qty = document.getElementById(`itemQty_${i}`).value;
                    const fileInput = document.getElementById(`itemImage_${i}`);
                    
                    let imageBase64 = null;
                    let imageMimeType = null;
                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        imageBase64 = await fileToBase64(file);
                        imageMimeType = file.type;
                    }

                    itemsData.push({ type: typeVal, style: style, quantity: qty, imageBase64: imageBase64, imageMimeType: imageMimeType });
                }

                const payload = {
                    name: document.getElementById('nameField').value.trim(),
                    phone: document.getElementById('phoneField').value.trim(),
                    lineName: document.getElementById('lineNameField').value.trim(),
                    shipping: shippingMethod.value,
                    address: finalAddress,
                    totalAmount: totalAmountDisplay.textContent,
                    isPaid: document.getElementById('isPaidCheckbox').checked ? '已付款' : '未付款',
                    items: itemsData
                };

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    showMessageBox('預購表單已成功送出！');
                    document.getElementById('preorderForm').reset();
                    // 重置特定狀態
                    document.getElementById('fullAddressRow').classList.add('hidden');
                    sevenElevenBlock.classList.add('hidden');
                    normalAddressBlock.classList.add('hidden');
                    totalAmountDisplay.textContent = '0';
                } else {
                    showMessageBox('送出失敗，請稍後再試。', true);
                    console.error('GAS Error:', result.message);
                }

            } catch (error) {
                showMessageBox('網路錯誤，請檢查連線。', true);
                console.error(error);
            } finally {
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // 訊息彈跳視窗邏輯
        const messageOverlay = document.getElementById('messageOverlay');
        const messageBox = document.getElementById('messageBox');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');
        const messageCloseBtn = document.getElementById('messageCloseBtn');

        function showMessageBox(text, isError = false) {
            messageText.textContent = text;
            messageTitle.textContent = isError ? '錯誤' : '成功';
            messageTitle.className = `text-xl font-bold mb-4 ${isError ? 'text-red-500' : 'text-green-500'}`;
            messageOverlay.classList.remove('hidden');
            setTimeout(() => messageBox.classList.remove('scale-95'), 10);
        }

        function closeMessageBox() {
            messageBox.classList.add('scale-95');
            setTimeout(() => messageOverlay.classList.add('hidden'), 200);
        }

        messageCloseBtn.addEventListener('click', closeMessageBox);
    </script>
</body>
</html>
