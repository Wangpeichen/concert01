<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sevenbaby.py演唱會現場預購表單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 從 image_000abc.png 提取的配色 */
        .bg-custom-blue { background-color: #80C5D6; } /* 最上方的藍色，用於主背景 */
        .bg-custom-pink { background-color: #FBA4AE; } /* 最下方的粉紅色，用於強調色 */
        .text-custom-pink { color: #FBA4AE; }
        .border-custom-pink { border-color: #FBA4AE; }
        .focus-custom-pink:focus { border-color: #F88593; box-shadow: 0 0 0 2px rgba(251, 164, 174, 0.3); }
        
        .bg-custom-light-pink { background-color: #FDE4D8; } /* 淺粉色，用於區塊背景 */
        .bg-custom-light-blue { background-color: #B6DFD6; } /* 淺藍綠色，用於輸入框背景點綴 */

        /* 隱藏預設的檔案上傳按鈕樣式 */
        input[type="file"]::file-selector-button {
            display: none;
        }

        /* 標題字體陰影增加立體感 */
        .title-shadow {
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
        }
    </style>
</head>
<body class="bg-custom-blue min-h-screen py-10 font-sans">

    <div class="max-w-2xl mx-auto bg-white p-8 shadow-2xl rounded-2xl border-4 border-white">
        <h1 class="text-4xl font-extrabold text-center mb-8 text-custom-pink title-shadow tracking-wider leading-snug">
            sevenbaby.py<br>演唱會現場預購表單
        </h1>

        <form id="preorderForm" class="space-y-6">
            
            <div id="itemsContainer" class="space-y-6">
                <!-- 預設的第一個品項區塊 -->
                <div class="item-block border-b-2 border-dashed border-gray-200 pb-6 relative group" data-index="0">
                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">品項</label>
                        <select name="items[0][type]" class="item-type w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                            <option value="">請選擇</option>
                            <option value="keychain">雙掛件 ($250)</option>
                            <option value="stand">手機支架 ($450)</option>
                            <option value="acrylic">立牌 ($450)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">樣式</label>
                        <input type="text" name="items[0][style]" placeholder="ex: 東海老虎款" class="w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">數量</label>
                        <input type="number" name="items[0][quantity]" min="1" value="1" class="item-quantity w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-start">
                        <label class="text-right font-bold text-gray-700 mt-2">圖片上傳</label>
                        <div class="w-full relative">
                            <input type="file" name="items[0][image]" accept="image/*" class="w-full p-10 border-2 border-dashed border-custom-pink bg-custom-light-pink bg-opacity-50 rounded-lg text-center cursor-pointer hover:bg-opacity-80 transition-all font-medium text-gray-800">
                            <p class="absolute inset-0 flex items-center justify-center pointer-events-none text-gray-500 font-bold">點擊或拖曳上傳照片</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-start pl-[116px]">
                <button type="button" id="addItemBtn" class="bg-custom-pink text-white font-bold py-2 px-4 rounded-full hover:bg-pink-400 transition-colors shadow-sm">
                    ＋ 新增其他品項
                </button>
            </div>

            <div class="mt-10 space-y-5 bg-custom-light-pink bg-opacity-30 p-6 rounded-xl border border-gray-100">
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">姓名</label>
                    <input type="text" name="name" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                </div>

                <div class="grid grid-cols-[100px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">寄送方式</label>
                    <select id="shippingMethod" name="shipping" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                        <option value="">請選擇</option>
                        <option value="registered">掛號 (+30)</option>
                        <option value="store">7-11店到店 (+60)</option>
                    </select>
                </div>

                <!-- 地址輸入與按鈕 -->
                <div class="grid grid-cols-[100px_1fr_auto] gap-4 items-center" id="addressInputRow">
                    <label class="text-right font-bold text-gray-700">地址</label>
                    <input type="text" id="addressField" name="address" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800">
                    <button type="button" id="fetchZipBtn" class="bg-custom-blue text-white px-4 py-3 rounded-lg font-bold hover:bg-blue-400 transition-colors text-sm whitespace-nowrap shadow-sm">
                        自動抓取郵遞區號
                    </button>
                </div>
                <!-- 顯示完整地址 (初始隱藏) -->
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center hidden" id="fullAddressRow">
                    <label class="text-right font-bold text-gray-500">完整地址</label>
                    <input type="text" id="fullAddressField" readonly class="w-full p-3 border-2 border-gray-200 bg-gray-100 rounded-lg text-gray-600 font-medium cursor-not-allowed">
                </div>

                <!-- 7-11店名輸入 -->
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center hidden" id="storeInputRow">
                    <label class="text-right font-bold text-gray-700">7-11店名</label>
                    <input type="text" id="storeNameField" name="storeName" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800">
                </div>
                
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">電話</label>
                    <input type="tel" name="phone" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                </div>
                
                <!-- 新增 LINE 名稱欄位 -->
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">LINE名稱</label>
                    <input type="text" name="lineName" class="w-full p-3 border-2 border-white bg-white shadow-sm rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" placeholder="非必填">
                </div>
                
                <!-- 新增已付款選取方塊 -->
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center">
                    <label class="text-right font-bold text-gray-700">付款狀態</label>
                    <label class="flex items-center space-x-2 cursor-pointer w-max">
                        <input type="checkbox" name="isPaid" class="w-6 h-6 accent-[#FBA4AE] cursor-pointer rounded border-gray-300">
                        <span class="font-bold text-gray-700">已付款</span>
                    </label>
                </div>
                
                <div class="grid grid-cols-[100px_1fr] gap-4 items-center pt-6 border-t border-gray-200 mt-6">
                    <label class="text-right font-black text-gray-800 text-xl">總金額</label>
                    <div class="w-full p-4 bg-custom-pink rounded-xl font-black text-2xl text-white text-center shadow-inner">
                        NT$ <span id="totalAmount">0</span>
                    </div>
                </div>
            </div>

            <div class="flex justify-center mt-10 pt-4">
                <button type="submit" class="bg-gray-800 text-white px-12 py-4 rounded-full font-black text-xl hover:bg-gray-900 transition-transform transform hover:scale-105 shadow-xl">
                    送出預購訂單
                </button>
            </div>
        </form>
    </div>

    <script>
        // 設定 Google Apps Script 網址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfZJtDH75exrwCQsHaA_mgyPUL108oFkbELp7-ACSokShecjzO1RwHy9U_epKIrd8rew/exec';

        // 圖片轉 Base64 輔助函數 (必須要有這個才能正確上傳圖片)
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const result = reader.result;
                const base64 = result.split(',')[1];
                const mimeType = result.split(';')[0].split(':')[1];
                resolve({ base64, mimeType });
            };
            reader.onerror = error => reject(error);
        });

        const itemPrices = {
            'keychain': 250,
            'stand': 450,
            'acrylic': 450
        };

        const shippingPrices = {
            'registered': 30,
            'store': 60
        };

        let itemCount = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const addItemBtn = document.getElementById('addItemBtn');
            const itemsContainer = document.getElementById('itemsContainer');
            const shippingMethod = document.getElementById('shippingMethod');
            const form = document.getElementById('preorderForm');
            
            const addressInputRow = document.getElementById('addressInputRow');
            const fullAddressRow = document.getElementById('fullAddressRow');
            const storeInputRow = document.getElementById('storeInputRow');

            const fetchZipBtn = document.getElementById('fetchZipBtn');
            const addressField = document.getElementById('addressField');
            const fullAddressField = document.getElementById('fullAddressField');

            const storeNameField = document.getElementById('storeNameField');

            // 初始綁定計算金額事件
            bindCalculationEvents();

            // 新增品項邏輯
            addItemBtn.addEventListener('click', () => {
                const newItemBlock = document.createElement('div');
                newItemBlock.className = 'item-block border-b-2 border-dashed border-gray-200 pb-6 mt-6 relative group';
                newItemBlock.dataset.index = itemCount;
                
                newItemBlock.innerHTML = `
                    <button type="button" class="remove-item-btn absolute -right-2 -top-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10 shadow-md hover:bg-red-600 font-bold" title="移除此品項">
                        &times;
                    </button>
                    
                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">品項</label>
                        <select name="items[${itemCount}][type]" class="item-type w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                            <option value="">請選擇</option>
                            <option value="keychain">雙掛件 ($250)</option>
                            <option value="stand">手機支架 ($450)</option>
                            <option value="acrylic">立牌 ($450)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">樣式</label>
                        <input type="text" name="items[${itemCount}][style]" placeholder="ex: 東海老虎款" class="w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-center mb-4">
                        <label class="text-right font-bold text-gray-700">數量</label>
                        <input type="number" name="items[${itemCount}][quantity]" min="1" value="1" class="item-quantity w-full p-3 border-2 border-transparent bg-custom-light-blue bg-opacity-30 rounded-lg focus:outline-none focus-custom-pink transition-colors font-medium text-gray-800" required>
                    </div>

                    <div class="grid grid-cols-[100px_1fr] gap-4 items-start">
                        <label class="text-right font-bold text-gray-700 mt-2">圖片上傳</label>
                        <div class="w-full relative">
                            <input type="file" name="items[${itemCount}][image]" accept="image/*" class="w-full p-10 border-2 border-dashed border-custom-pink bg-custom-light-pink bg-opacity-50 rounded-lg text-center cursor-pointer hover:bg-opacity-80 transition-all font-medium text-gray-800">
                            <p class="absolute inset-0 flex items-center justify-center pointer-events-none text-gray-500 font-bold">點擊或拖曳上傳照片</p>
                        </div>
                    </div>
                `;

                itemsContainer.appendChild(newItemBlock);
                itemCount++;
                bindCalculationEvents(); 
                
                newItemBlock.querySelector('.remove-item-btn').addEventListener('click', function() {
                    newItemBlock.remove();
                    calculateTotal();
                });
            });

            // 寄送方式變更邏輯 (切換地址/店名相關列)
            shippingMethod.addEventListener('change', (e) => {
                const method = e.target.value;
                if (method === 'registered') {
                    addressInputRow.classList.remove('hidden');
                    // 如果完整地址已經有值，也顯示出來
                    if(fullAddressField.value) fullAddressRow.classList.remove('hidden');
                    
                    storeInputRow.classList.add('hidden');
                    
                    addressField.required = true;
                    storeNameField.required = false;
                } else if (method === 'store') {
                    addressInputRow.classList.add('hidden');
                    fullAddressRow.classList.add('hidden');
                    
                    storeInputRow.classList.remove('hidden');
                    
                    addressField.required = false;
                    storeNameField.required = true;
                } else {
                    addressInputRow.classList.remove('hidden');
                    fullAddressRow.classList.add('hidden');
                    storeInputRow.classList.add('hidden');
                }
            });

            // 自動抓取郵遞區號邏輯 (透過 API)
            fetchZipBtn.addEventListener('click', async () => {
                const addr = addressField.value.trim();
                if (!addr) {
                    showMessageBox('請先輸入地址！', true);
                    return;
                }
                
                fetchZipBtn.textContent = '抓取中...';
                fetchZipBtn.disabled = true;
                
                try {
                    // 使用 zip5.5432.tw API
                    const response = await fetch(`https://zip5.5432.tw/zip5json.py?adrs=${encodeURIComponent(addr)}`);
                    const data = await response.json();

                    if (data && data.zipcode) {
                        // 成功取得郵遞區號，組合新地址 (郵遞區號 + 原地址)
                        // data.zipcode6 是 3+3, data.zipcode 是 3+2
                        const zipCodeToUse = data.zipcode6 || data.zipcode;
                        fullAddressField.value = `${zipCodeToUse} ${addr}`;
                        fullAddressRow.classList.remove('hidden');
                    } else {
                        // 查無資料
                        showMessageBox('無法找到對應的郵遞區號，請確認地址是否正確。', true);
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    showMessageBox('抓取郵遞區號發生錯誤，請稍後再試。', true);
                } finally {
                    fetchZipBtn.textContent = '自動抓取郵遞區號';
                    fetchZipBtn.disabled = false;
                }
            });

            // 表單提交事件
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // 簡單驗證：如果有選掛號，但沒抓取郵遞區號
                if (shippingMethod.value === 'registered' && !fullAddressField.value) {
                    showMessageBox('請點擊「自動抓取郵遞區號」按鈕確認完整地址！', true);
                    return;
                }

                if (GAS_URL === '請將這裡替換成您的_Google_Apps_Script_URL' || GAS_URL === '') {
                    showMessageBox('系統未設定正確的資料庫連結 (GAS_URL)，無法送出。', true);
                    return;
                }

                // 改變按鈕狀態，避免重複送出
                const submitBtn = document.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                submitBtn.innerHTML = '資料上傳中，請稍候... <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

                try {
                    // 1. 收集基本資料
                    const formData = {
                        name: document.querySelector('[name="name"]').value,
                        phone: document.querySelector('[name="phone"]').value,
                        lineName: document.querySelector('[name="lineName"]').value,
                        shipping: document.querySelector('[name="shipping"]').value,
                        address: document.querySelector('[name="shipping"]').value === 'store' ? 
                                 document.getElementById('storeNameField') ? document.getElementById('storeNameField').value : document.getElementById('addressField').value 
                                 : (document.getElementById('fullAddressField').value || document.getElementById('addressField').value),
                        totalAmount: document.getElementById('totalAmount').textContent,
                        isPaid: document.querySelector('[name="isPaid"]').checked ? '已付款' : '未付款',
                        items: []
                    };

                    // 2. 非同步收集所有品項與圖片
                    const itemBlocks = document.querySelectorAll('.item-block');
                    const itemPromises = Array.from(itemBlocks).map(async (block) => {
                        const type = block.querySelector('.item-type').value;
                        const style = block.querySelector('input[name*="[style]"]').value;
                        const quantity = block.querySelector('.item-quantity').value;
                        const fileInput = block.querySelector('input[type="file"]');
                        let imageBase64 = null;
                        let imageMimeType = null;

                        // 如果有選擇圖片，進行轉碼
                        if (fileInput.files.length > 0) {
                            const fileData = await fileToBase64(fileInput.files[0]);
                            imageBase64 = fileData.base64;
                            imageMimeType = fileData.mimeType;
                        }

                        return { type, style, quantity, imageBase64, imageMimeType };
                    });

                    // 等待所有圖片處理完成
                    formData.items = await Promise.all(itemPromises);

                    // 3. 透過 POST 傳送給 Google Apps Script
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(formData),
                        // 使用 text/plain 避免觸發 CORS 預檢請求
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        }
                    });

                    const result = await response.json();

                    if (result.status === 'success') {
                        showMessageBox(`🎀 訂單已成功送出！\n總金額為 NT$ ${formData.totalAmount}\n感謝您的購買。`);
                        form.reset(); // 清空表單
                        calculateTotal(); // 重新計算金額(歸零)
                        // 隱藏動態欄位
                        addressInputRow.classList.add('hidden');
                        fullAddressRow.classList.add('hidden');
                        if(storeInputRow) storeInputRow.classList.add('hidden');
                        // 移除額外新增的品項區塊，只留第一個
                        const allBlocks = document.querySelectorAll('.item-block');
                        for(let i=1; i<allBlocks.length; i++) {
                            allBlocks[i].remove();
                        }
                    } else {
                        showMessageBox(`送出失敗，請稍後再試。\n錯誤訊息: ${result.message}`, true);
                    }

                } catch (error) {
                    console.error('Submit Error:', error);
                    showMessageBox('連線發生錯誤，無法送出表單。請確認您的網路狀態或聯絡主辦單位。', true);
                } finally {
                    // 恢復按鈕狀態
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                }
            });
        });

        // 綁定所有會影響金額的輸入框事件
        function bindCalculationEvents() {
            const types = document.querySelectorAll('.item-type');
            const quantities = document.querySelectorAll('.item-quantity');

            types.forEach(select => {
                select.removeEventListener('change', calculateTotal);
                select.addEventListener('change', calculateTotal);
            });

            quantities.forEach(input => {
                input.removeEventListener('input', calculateTotal);
                input.addEventListener('input', calculateTotal);
            });
        }

        // 計算總金額邏輯
        function calculateTotal() {
            let total = 0;
            const items = document.querySelectorAll('.item-block');

            items.forEach(item => {
                const typeSelect = item.querySelector('.item-type');
                const quantityInput = item.querySelector('.item-quantity');
                
                const type = typeSelect.value;
                const quantity = parseInt(quantityInput.value) || 0;

                if (type && itemPrices[type]) {
                    total += itemPrices[type] * quantity;
                }
            });

            const shippingMethod = document.getElementById('shippingMethod').value;
            if (shippingMethod && shippingPrices[shippingMethod]) {
                total += shippingPrices[shippingMethod];
            }

            document.getElementById('totalAmount').textContent = total;
        }

        // 自訂訊息方塊函數
        function showMessageBox(message, isWarning = false) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm transition-opacity';
            
            const box = document.createElement('div');
            box.className = 'bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-100 transition-transform';
            
            const icon = document.createElement('div');
            icon.className = `text-4xl mb-4 ${isWarning ? 'text-red-500' : 'text-custom-pink'}`;
            icon.innerHTML = isWarning ? '⚠️' : '🎀';
            
            const msgP = document.createElement('p');
            msgP.className = 'text-gray-800 mb-8 whitespace-pre-line font-bold text-lg';
            msgP.textContent = message;
            
            const btn = document.createElement('button');
            btn.className = `text-white px-8 py-3 rounded-full font-bold transition-colors shadow-md ${isWarning ? 'bg-red-500 hover:bg-red-600' : 'bg-custom-pink hover:bg-pink-400'}`;
            btn.textContent = '確定';
            btn.onclick = () => {
                overlay.classList.add('opacity-0');
                setTimeout(() => document.body.removeChild(overlay), 200);
            };
            
            box.appendChild(icon);
            box.appendChild(msgP);
            box.appendChild(btn);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
